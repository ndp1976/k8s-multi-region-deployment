apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "web-app-a.fullname" . }}-config
  labels:
    {{- include "web-app-a.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.APP_NAME | quote }}
  APP_ENV: {{ .Values.config.APP_ENV | quote }}
  WEB_APP_B_URL: {{ .Values.config.WEB_APP_B_URL | quote }}
  SPIKE_SECONDS: {{ .Values.config.SPIKE_SECONDS | quote }}
