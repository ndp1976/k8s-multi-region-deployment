apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web-app-b.fullname" . }}
  labels:
    {{- include "web-app-b.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "web-app-b.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "web-app-b.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: {{ include "web-app-b.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "web-app-b.fullname" . }}-config
            - secretRef:
                name: {{ include "web-app-b.fullname" . }}-secret
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # needs /tmp for TLS cert tempfile
            capabilities:
              drop: ["ALL"]
